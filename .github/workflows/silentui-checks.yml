name: SilentUI static checks

on:
  push:
    paths:
      - "src/SilentUI/**"
      - "examples/**"
      - "tests/**"
      - "default.project.json"
      - ".github/workflows/silentui-checks.yml"
  pull_request:
    paths:
      - "src/SilentUI/**"
      - "examples/**"
      - "tests/**"
      - "default.project.json"
      - ".github/workflows/silentui-checks.yml"

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check library source contracts
        run: python tests/static_contracts.py
      - name: Check showcase public API coverage
        run: python tests/showcase_contracts.py
